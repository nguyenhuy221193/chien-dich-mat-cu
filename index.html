<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biệt Đội Mắt Cú - Phản Xạ Tình Huống</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden;
        }
        .header {
            text-align: center; padding: 15px; width: 100%; z-index: 10;
            background: linear-gradient(90deg, #e52e71, #ff8a00); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { margin: 0; font-size: 2.2rem; text-transform: uppercase; }
        
        .main-stage {
            position: relative; width: 100%; max-width: 1000px; flex-grow: 1; 
            display: flex; justify-content: center; align-items: center; margin-top: 20px;
        }
        
        /* Camera Background */
        .input_video { display: none; }
        .output_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; border-radius: 20px; transform: scaleX(-1); border: 5px solid #4a4e69;
        }

        /* Video Tình Huống (Nằm đè lên Camera khi chiếu) */
        #situationVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; border-radius: 20px; z-index: 15; display: none; background: black;
        }

        /* Lớp phủ UI */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.7); border-radius: 20px; z-index: 20;
        }
        
        .timer-alert {
            font-size: 8rem; font-weight: bold; color: #e74c3c; text-shadow: 0 0 20px #fff;
            animation: pulse 0.5s infinite; display: none; z-index: 25;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .btn {
            padding: 20px 40px; font-size: 2rem; border: none; border-radius: 50px; cursor: pointer;
            font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.2s;
        }
        .btn-start { background: #f1c40f; color: #000; }
        .btn-start:hover { transform: scale(1.05); }

        .message { font-size: 4rem; font-weight: bold; margin-bottom: 20px; text-align: center; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🦸 BIỆT ĐỘI MẮT CÚ - HUẤN LUYỆN PHẢN XẠ 🦸</h1>
    </div>

    <div class="main-stage">
        <video class="input_video"></video>
        <canvas class="output_canvas" width="1280" height="720"></canvas>
        
        <!-- THAY LINK VIDEO TÌNH HUỐNG CỦA BẠN VÀO DÒNG DƯỚI ĐÂY -->
        <video id="situationVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" playsinline></video>
        
        <div class="timer-alert" id="timerUI">3</div>

        <div class="overlay" id="uiLayer">
            <div class="message" id="messageText">Sẵn sàng đối mặt thử thách?</div>
            <button class="btn btn-start" id="actionBtn" onclick="startSituation()">PHÁT VIDEO TÌNH HUỐNG</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const situationVideo = document.getElementById('situationVideo');
        const uiLayer = document.getElementById('uiLayer');
        const messageText = document.getElementById('messageText');
        const actionBtn = document.getElementById('actionBtn');
        const timerUI = document.getElementById('timerUI');

        let gameState = 'IDLE'; // IDLE, PLAYING, REACTING, END
        let countdownTimer;

        // Xử lý khi bấm nút "Phát Video"
        function startSituation() {
            gameState = 'PLAYING';
            uiLayer.style.display = 'none';
            situationVideo.style.display = 'block';
            situationVideo.currentTime = 0;
            situationVideo.play();
        }

        // Bắt sự kiện khi Video tình huống chiếu xong
        situationVideo.onended = function() {
            situationVideo.style.display = 'none'; // Tắt video, lộ camera ra
            gameState = 'REACTING';
            
            // Bắt đầu đếm ngược 3 giây
            let timeLeft = 3;
            timerUI.style.display = 'block';
            timerUI.innerText = timeLeft;

            countdownTimer = setInterval(() => {
                timeLeft--;
                timerUI.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    triggerFailure();
                }
            }, 1000);
        };

        function triggerSuccess() {
            if (gameState !== 'REACTING') return;
            gameState = 'END';
            clearInterval(countdownTimer);
            timerUI.style.display = 'none';
            
            uiLayer.style.display = 'flex';
            uiLayer.style.background = 'rgba(46, 204, 113, 0.9)'; // Nền xanh lá
            messageText.innerText = "TUYỆT VỜI!\nTỪ CHỐI THÀNH CÔNG!";
            messageText.style.color = "#fff";
            actionBtn.innerText = "HỌC SINH TIẾP THEO";
            
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }

        function triggerFailure() {
            if (gameState !== 'REACTING') return;
            gameState = 'END';
            timerUI.style.display = 'none';

            uiLayer.style.display = 'flex';
            uiLayer.style.background = 'rgba(231, 76, 60, 0.9)'; // Nền đỏ
            messageText.innerText = "QUÁ CHẬM!\nBẠN ĐÃ BỊ LỪA!";
            messageText.style.color = "#fff";
            actionBtn.innerText = "THỬ LẠI";
        }

        // Nhận diện AI MediaPipe
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                // Chỉ vẽ đường nối tay nếu đang ở trạng thái chờ phản xạ hoặc IDLE để HS thấy
                if (gameState === 'REACTING' || gameState === 'IDLE') {
                    const lw = results.poseLandmarks[15]; const rw = results.poseLandmarks[16];
                    const le = results.poseLandmarks[13]; const re = results.poseLandmarks[14];

                    // Nhận diện tay đan chéo
                    if (lw.visibility > 0.5 && rw.visibility > 0.5) {
                        const armsRaised = (lw.y < le.y) && (rw.y < re.y);
                        const armsCrossed = (lw.x > rw.x) || (rw.x > lw.x && Math.abs(lw.x - rw.x) > 0.05); // Xuyên qua nhau
                        
                        if (armsRaised && armsCrossed) {
                            if (gameState === 'REACTING') {
                                triggerSuccess();
                            }
                        }
                    }
                }
            }
            canvasCtx.restore();
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); }, width: 1280, height: 720
        });
        
        navigator.mediaDevices.getUserMedia({ video: true }).then(() => camera.start());
    </script>
</body>
</html>

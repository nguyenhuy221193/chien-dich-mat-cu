<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biệt Đội Mắt Cú - Lá Chắn Từ Chối</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .header {
            text-align: center; padding: 15px; width: 100%;
            background: rgba(0, 0, 0, 0.5); border-bottom: 4px solid #fca311;
        }
        h1 { margin: 0; font-size: 2.5rem; color: #fca311; text-shadow: 2px 2px 0px #000; }
        .score-board {
            font-size: 1.5rem; margin-top: 10px; padding: 5px 20px;
            background: #e74c3c; border-radius: 20px; display: inline-block;
        }
        .main-container {
            position: relative; width: 95%; max-width: 800px;
            margin-top: 20px; display: flex; justify-content: center;
        }
        .input_video { display: none; }
        .output_canvas {
            width: 100%; border-radius: 20px; border: 8px solid #fff;
            transform: scaleX(-1); background-color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .instruction-box {
            background: #fff; color: #000; padding: 15px 30px; border-radius: 30px;
            font-size: 1.5rem; font-weight: bold; margin-top: 20px; text-align: center;
            border: 4px solid #fca311; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 204, 113, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            opacity: 0; pointer-events: none; transition: 0.3s; border-radius: 20px;
        }
        .success-overlay.active { opacity: 1; pointer-events: all; }
        .success-title { font-size: 4rem; color: white; text-shadow: 3px 3px 0 #27ae60; margin: 0; }
        .btn-next {
            margin-top: 20px; padding: 15px 40px; font-size: 1.5rem; font-family: inherit;
            background: #f1c40f; color: #000; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; box-shadow: 0 5px 0 #d4ac0d;
        }
        .btn-next:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body>

    <!-- Âm thanh chúc mừng (Dùng link file audio công khai) -->
    <audio id="win-sound" src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg" preload="auto"></audio>

    <div class="header">
        <h1>🦸 BIỆT ĐỘI MẮT CÚ 🦸</h1>
        <div class="score-board">Điểm dũng cảm: <span id="score">0</span> 🌟</div>
    </div>

    <div class="main-container">
        <video class="input_video"></video>
        <div style="position: relative; width: 100%;">
             <canvas class="output_canvas" width="1280" height="720"></canvas>
             
             <div class="success-overlay" id="success-ui">
                <h2 class="success-title">TUYỆT VỜI!</h2>
                <p style="font-size: 2rem; color: white;">Bạn đã từ chối thành công!</p>
                <button class="btn-next" onclick="nextStudent()">Học sinh tiếp theo 🚀</button>
            </div>
        </div>
    </div>

    <div class="instruction-box" id="instruction">
        ⚠️ NGƯỜI LẠ CHO KẸO! Hãy giơ tay đan chéo (Chữ X) để từ chối!
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const successUi = document.getElementById('success-ui');
        const scoreElement = document.getElementById('score');
        const winSound = document.getElementById('win-sound');
        
        let isSuccess = false;
        let score = 0;

        // Yêu cầu quyền Camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(startAI)
            .catch(() => alert("Vui lòng cấp quyền Camera để chơi game!"));

        function nextStudent() {
            isSuccess = false;
            successUi.classList.remove('active');
        }

        function triggerSuccess() {
            if (isSuccess) return;
            isSuccess = true;
            score += 10; // Cộng 10 điểm
            scoreElement.innerText = score;
            
            // Hiện màn hình chúc mừng & phát âm thanh
            successUi.classList.add('active');
            winSound.currentTime = 0;
            winSound.play().catch(e => console.log("Trình duyệt chặn auto-play âm thanh"));
            
            // Pháo hoa
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                // Chỉ vẽ đường nối tay để HS nhìn thấy rõ hành động của mình
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#fca311', lineWidth: 6});

                if (!isSuccess) {
                    const lw = results.poseLandmarks[15]; // Cổ tay trái
                    const rw = results.poseLandmarks[16]; // Cổ tay phải
                    const le = results.poseLandmarks[13]; // Khuỷu tay trái
                    const re = results.poseLandmarks[14]; // Khuỷu tay phải

                    if (lw.visibility > 0.5 && rw.visibility > 0.5) {
                        const armsRaised = (lw.y < le.y) && (rw.y < re.y);
                        const armsCrossed = (lw.x > rw.x);
                        if (armsRaised && armsCrossed) triggerSuccess();
                    }
                }
            }
            canvasCtx.restore();
        }

        function startAI() {
            const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
            pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            pose.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({image: videoElement}); },
                width: 1280, height: 720
            });
            camera.start();
        }
    </script>
</body>
</html>
